<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Node Relationship Engine</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='18' cy='5' r='3'%3E%3C/circle%3E%3Ccircle cx='6' cy='12' r='3'%3E%3C/circle%3E%3Ccircle cx='18' cy='19' r='3'%3E%3C/circle%3E%3Cline x1='8.59' y1='13.51' x2='15.42' y2='17.49'%3E%3C/line%3E%3Cline x1='15.41' y1='6.51' x2='8.59' y2='10.49'%3E%3C/line%3E%3C/svg%3E">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        #network-box {
            width: 100%;
            height: 600px;
            border-radius: 12px;
            transition: background-color 0.3s ease;
        }

        .graph-layout {
            align-items: stretch;
        }

        @media (min-width: 1024px) {
            .graph-layout {
                grid-template-columns: minmax(0, 1fr) 320px;
            }

            #network-box {
                height: 78vh;
                min-height: 720px;
                max-height: 1000px;
            }
        }

        @media (min-width: 1440px) {
            .graph-layout {
                grid-template-columns: minmax(0, 1fr) 340px;
            }

            #network-box {
                height: 82vh;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
    </style>
</head>

<body class="bg-slate-100 dark:bg-slate-900 transition-colors duration-300 p-4 md:p-8">

    <div class="mx-auto w-full max-w-[1800px] px-4 md:px-6 xl:px-8">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
            <div>
                <h1 id="main-title" class="text-3xl font-bold text-slate-800 dark:text-slate-100">Select a dataset</h1>
                <p class="text-slate-500 dark:text-slate-400 font-medium">Auto-scanning JSON files in ./files/</p>
            </div>

            <div class="flex items-center gap-3">

                <div
                    class="flex items-center bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg shadow-sm overflow-hidden">

                    <button id="spacing-expand" title="Increase node spacing"
                        class="p-2.5 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 transition-all border-r border-slate-200 dark:border-slate-700">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 3H3v6M15 3h6v6M9 21H3v-6M15 21h6v-6" />
                        </svg>
                    </button>

                    <button id="spacing-collapse" title="Decrease node spacing"
                        class="p-2.5 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 transition-all">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 9H3V3M15 9h6V3M9 15H3v6M15 15h6v6" />
                        </svg>
                    </button>
                </div>

                <!-- Zoom controls -->
                <div
                    class="flex items-center bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg shadow-sm overflow-hidden">
                    <button id="zoom-in" title="Zoom in"
                        class="p-2.5 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 transition-all border-r border-slate-200 dark:border-slate-700">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4">
                            </path>
                        </svg>
                    </button>
                    <button id="zoom-out" title="Zoom out"
                        class="p-2.5 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 transition-all">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path>
                        </svg>
                    </button>
                </div>

                <!-- Theme toggle -->
                <button id="theme-toggle"
                    class="p-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg shadow-sm text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 transition-all">
                    <!-- Sun icon -->
                    <svg id="sun-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 3v1m0 16v1m9-9h-1M4 9H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M12 5a7 7 0 100 14 7 7 0 000-14z">
                        </path>
                    </svg>
                    <!-- Moon icon -->
                    <svg id="moon-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z">
                        </path>
                    </svg>
                </button>

                <!-- Data controls (refresh + dropdown) -->
                <div
                    class="flex items-center gap-0 bg-white dark:bg-slate-800 rounded-lg shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
                    <button id="refresh-data" title="Reload current data"
                        class="p-2.5 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 transition-all border-r border-slate-200 dark:border-slate-700">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357-2H15">
                            </path>
                        </svg>
                    </button>
                    <select id="data-selector"
                        class="bg-transparent text-slate-700 dark:text-slate-200 font-medium px-3 py-1 focus:outline-none cursor-pointer h-full">
                        <option value="">-- Scanning directory... --</option>
                    </select>
                </div>
            </div>
        </header>

        <!-- Group filter buttons -->
        <div id="group-filters" class="hidden mb-4 flex flex-wrap gap-2"></div>

        <div class="graph-layout grid grid-cols-1 gap-6 xl:gap-8">
            <div class="graph-main min-w-0">
                <div id="network-box"
                    class="bg-white dark:bg-slate-800 shadow-inner border border-slate-200 dark:border-slate-700 rounded-xl">
                </div>
            </div>

            <!-- Info panel -->
            <aside class="graph-side min-w-0">
                <div id="info-panel"
                    class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-md h-full border border-slate-200 dark:border-slate-700 transition-colors">
                    <h2 class="text-xl font-bold text-indigo-900 dark:text-indigo-400 mb-4">Node Details</h2>
                    <div id="info-content" class="text-slate-600 dark:text-slate-300 text-sm leading-relaxed">
                        Click a node to view details...
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script>
        // State
        let nodes = new vis.DataSet([]);
        let edges = new vis.DataSet([]);

        let spacingLevel = 200;
        const MIN_SPACING = 80;
        const MAX_SPACING = 600;

        let network = null;
        let currentTheme = localStorage.getItem('theme') || 'light';
        let originalEdgeLabels = {};

        const container = document.getElementById('network-box');
        const selector = document.getElementById('data-selector');
        const titleEl = document.getElementById('main-title');
        const themeBtn = document.getElementById('theme-toggle');
        const refreshBtn = document.getElementById('refresh-data');

        function initTheme() {
            if (currentTheme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('sun-icon').classList.remove('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('moon-icon').classList.remove('hidden');
            }
        }

        themeBtn.addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            currentTheme = isDark ? 'dark' : 'light';
            localStorage.setItem('theme', currentTheme);

            document.getElementById('sun-icon').classList.toggle('hidden');
            document.getElementById('moon-icon').classList.toggle('hidden');

            updateNetworkTheme();
        });

        document.getElementById('zoom-in').addEventListener('click', () => {
            if (network) {
                const currentScale = network.getScale();
                network.moveTo({
                    scale: currentScale * 1.2,
                    animation: { duration: 300, easingFunction: 'easeInOutQuad' }
                });
            }
        });

        document.getElementById('zoom-out').addEventListener('click', () => {
            if (network) {
                const currentScale = network.getScale();
                network.moveTo({
                    scale: currentScale * 0.8,
                    animation: { duration: 300, easingFunction: 'easeInOutQuad' }
                });
            }
        });

        refreshBtn.addEventListener('click', () => {
            const currentFile = selector.value;
            if (currentFile) {
                refreshBtn.querySelector('svg').classList.add('animate-spin');
                loadData(currentFile).finally(() => {
                    setTimeout(() => {
                        refreshBtn.querySelector('svg').classList.remove('animate-spin');
                    }, 500);
                });
            } else {
                loadManifest();
            }
        });

        async function loadManifest() {
            try {
                const response = await fetch('./files/');
                if (!response.ok) throw new Error('Failed to read directory listing');

                const htmlText = await response.text();

                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                const links = doc.querySelectorAll('a');

                selector.innerHTML = '<option value="">-- Select a dataset --</option>';

                let count = 0;
                for (let i = 0; i < links.length; i++) {
                    const href = links[i].getAttribute('href');

                    if (href && href.toLowerCase().endsWith('.json')) {
                        const fileName = decodeURIComponent(href.split('/').pop());

                        const option = document.createElement('option');
                        option.value = fileName;
                        option.textContent = fileName.replace(/\.json$/i, '');
                        selector.appendChild(option);
                        count++;
                    }
                }

                if (count === 0) {
                    selector.innerHTML = '<option value="">No JSON files found in directory</option>';
                }

            } catch (error) {
                console.warn('Auto-scan failed:', error.message);
                selector.innerHTML = '<option value="">Scan failed (check server settings)</option>';
            }
        }

        function getNetworkOptions(data = {}) {
            const isDark = document.documentElement.classList.contains('dark');

            const jsonOptions = data?.options || {};

            const nodes_size = jsonOptions?.nodes?.size ?? 22;
            const spacingLevel = jsonOptions?.physics?.barnesHut?.springLength ?? 160;

            return {
                nodes: {
                    shape: 'dot',
                    size: nodes_size,
                    font: {
                        size: 14,
                        color: isDark ? '#f1f5f9' : '#334155',
                        strokeWidth: 0
                    },
                    borderWidth: 2,
                    shadow: true
                },
                edges: {
                    arrows: 'to',
                    color: {
                        color: isDark ? '#475569' : '#cbd5e1',
                        highlight: '#6366f1',
                        hover: '#818cf8'
                    },
                    font: {
                        align: 'middle',
                        color: isDark ? '#94a3b8' : '#64748b',
                        size: 11,
                        background: isDark ? '#1e293b' : '#ffffff'
                    },
                    width: 1.5,
                    smooth: {
                        type: 'continuous'
                    }
                },
                physics: {
                    enabled: true,
                    barnesHut: {
                        springLength: spacingLevel,
                        gravitationalConstant: -2000,
                        centralGravity: 0.3,
                        springConstant: 0.04,
                        damping: 0.09
                    }
                },
                interaction: {
                    hover: true,
                    zoomView: false,
                    dragView: true
                }
            };
        }

        function updateSpacing(newSpacing) {
            spacingLevel = Math.max(MIN_SPACING, Math.min(MAX_SPACING, newSpacing));

            if (!network) return;

            network.setOptions({
                physics: {
                    enabled: true,
                    barnesHut: {
                        springLength: spacingLevel,
                        gravitationalConstant: -2000,
                        centralGravity: 0.3,
                        springConstant: 0.04,
                        damping: 0.09
                    }
                }
            });

            network.stabilize(200);
        }

        document.getElementById('spacing-expand').addEventListener('click', () => {
            updateSpacing(spacingLevel + 40);
        });

        document.getElementById('spacing-collapse').addEventListener('click', () => {
            updateSpacing(spacingLevel - 40);
        });

        function updateNetworkTheme() {
            if (network) {
                network.setOptions(getNetworkOptions());
            }
        }

        function resetHighlight() {
            const isDark = document.documentElement.classList.contains('dark');

            nodes.update(nodes.get().map(node => ({
                id: node.id,
                color: undefined,
                font: {
                    color: isDark ? '#f1f5f9' : '#334155'
                }
            })));

            edges.update(edges.get().map(edge => ({
                id: edge.id,
                label: originalEdgeLabels[edge.id] ?? '',
                color: {
                    color: isDark ? '#475569' : '#cbd5e1',
                    opacity: 1
                },
                font: {
                    color: isDark ? '#94a3b8' : '#64748b',
                    background: isDark ? '#1e293b' : '#ffffff',
                    size: 11
                },
                width: 1.5
            })));
        }

        function highlightConnected(nodeId) {
            const isDark = document.documentElement.classList.contains('dark');

            const connectedNodeIds = new Set(network.getConnectedNodes(nodeId));
            const connectedEdgeIds = new Set(network.getConnectedEdges(nodeId));
            connectedNodeIds.add(nodeId);

            const fadedNodeColor = isDark ? 'rgba(148,163,184,0.18)' : 'rgba(148,163,184,0.25)';
            const fadedFontColor = isDark ? 'rgba(241,245,249,0.25)' : 'rgba(51,65,85,0.25)';
            const normalFontColor = isDark ? '#f1f5f9' : '#334155';

            nodes.update(nodes.get().map(node => {
                const active = connectedNodeIds.has(node.id);
                return {
                    id: node.id,
                    color: active
                        ? undefined
                        : {
                            background: fadedNodeColor,
                            border: fadedNodeColor
                        },
                    font: {
                        color: active ? normalFontColor : fadedFontColor
                    }
                };
            }));

            edges.update(edges.get().map(edge => {
                const active = connectedEdgeIds.has(edge.id);
                return {
                    id: edge.id,
                    // 修正關鍵：非關聯 edge 將 label 清空、size 設為 0、顏色設為透明
                    label: active ? (originalEdgeLabels[edge.id] ?? '') : '',
                    color: {
                        color: active ? (isDark ? '#6366f1' : '#4f46e5') : (isDark ? 'rgba(71,85,105,0.1)' : 'rgba(203,213,225,0.2)'),
                        opacity: 1
                    },
                    font: {
                        color: active ? (isDark ? '#94a3b8' : '#64748b') : 'rgba(0,0,0,0)',
                        background: active ? (isDark ? '#1e293b' : '#ffffff') : 'rgba(0,0,0,0)',
                        size: active ? 11 : 0
                    },
                    width: active ? 2.5 : 1
                };
            }));
        }

        let activeGroupFilter = null;

        function highlightGroup(groupKey) {
            const isDark = document.documentElement.classList.contains('dark');
            const fadedNodeColor = isDark ? 'rgba(148,163,184,0.18)' : 'rgba(148,163,184,0.25)';
            const fadedFontColor = isDark ? 'rgba(241,245,249,0.25)' : 'rgba(51,65,85,0.25)';
            const normalFontColor = isDark ? '#f1f5f9' : '#334155';

            const nodeUpdates = nodes.get().map(node => {
                const active = node.group === groupKey;
                return {
                    id: node.id,
                    color: active ? undefined : {
                        background: fadedNodeColor,
                        border: fadedNodeColor
                    },
                    font: { color: active ? normalFontColor : fadedFontColor }
                };
            });

            const edgeUpdates = edges.get().map(edge => ({
                id: edge.id,
                label: '',
                color: {
                    color: isDark ? 'rgba(71,85,105,0.15)' : 'rgba(203,213,225,0.25)',
                    opacity: 1
                },
                font: { size: 0 },
                width: 1
            }));

            nodes.update(nodeUpdates);
            edges.update(edgeUpdates);
        }

        function renderGroupButtons(data) {
            const container = document.getElementById('group-filters');
            container.innerHTML = '';
            activeGroupFilter = null;

            const groupTitles = data?.metadata?.groups || {};
            const uniqueGroups = [...new Set((data.nodes || []).map(n => n.group).filter(Boolean))];

            if (uniqueGroups.length === 0) {
                container.classList.add('hidden');
                return;
            }

            uniqueGroups.forEach(groupKey => {
                const label = groupTitles[groupKey] || groupKey;
                const btn = document.createElement('button');
                btn.dataset.group = groupKey;
                btn.textContent = label;
                btn.className = 'px-3 py-1.5 text-xs font-semibold rounded-full border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-indigo-50 dark:hover:bg-indigo-900/40 hover:border-indigo-400 dark:hover:border-indigo-500 transition-all';

                btn.addEventListener('click', () => {
                    if (activeGroupFilter === groupKey) {
                        activeGroupFilter = null;
                        resetHighlight();
                        container.querySelectorAll('button').forEach(b => b.classList.remove('bg-indigo-600', 'dark:bg-indigo-700', 'text-white', 'border-indigo-600', 'dark:border-indigo-500'));
                    } else {
                        activeGroupFilter = groupKey;
                        highlightGroup(groupKey);
                        container.querySelectorAll('button').forEach(b => {
                            const isActive = b.dataset.group === groupKey;
                            b.classList.toggle('bg-indigo-600', isActive);
                            b.classList.toggle('dark:bg-indigo-700', isActive);
                            b.classList.toggle('text-white', isActive);
                            b.classList.toggle('border-indigo-600', isActive);
                        });
                    }
                });

                container.appendChild(btn);
            });

            container.classList.remove('hidden');
        }

        async function loadData(fileName) {
            if (!fileName) return;

            try {
                const response = await fetch(`./files/${fileName}?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error('Failed to load file');

                const data = await response.json();

                titleEl.innerText = data.title || fileName.replace(/\.json$/i, '');
                nodes.clear();
                edges.clear();
                nodes.add(data.nodes);
                edges.add(data.edges);

                // 備份原始標籤
                originalEdgeLabels = {};
                edges.get().forEach(e => {
                    originalEdgeLabels[e.id] = e.label || '';
                });

                renderGroupButtons(data);

                const networkOptions = getNetworkOptions(data);

                if (!network) {
                    network = new vis.Network(container, { nodes, edges }, networkOptions);

                    network.on("click", (params) => {
                        const infoContent = document.getElementById('info-content');
                        if (params.nodes.length > 0) {
                            const nodeId = params.nodes[0];
                            const nodeData = nodes.get(nodeId);

                            highlightConnected(nodeId);

                            const description = nodeData.bio || nodeData.title || 'No description available.';

                            const groupName = (data.metadata?.groups && data.metadata.groups[nodeData.group]) || nodeData.group || 'General';

                            const connectedEdgeIds = network.getConnectedEdges(nodeId);
                            const connectedEdges = connectedEdgeIds
                                .map(eid => edges.get(eid))
                                .filter(e => e != null && (e.label || e.title));

                            let edgesHtml = '';
                            if (connectedEdges.length > 0) {
                                const rows = connectedEdges.map(e => {
                                    const label = e.label || '—';
                                    const title = e.title || '—';
                                    return `<li class="flex gap-2 py-1 border-b border-slate-100 dark:border-slate-700 last:border-0">
                                        <span class="font-medium text-indigo-700 dark:text-indigo-300 shrink-0">${label}</span>
                                        <span class="text-slate-500 dark:text-slate-400 truncate">${title}</span>
                                    </li>`;
                                }).join('');
                                edgesHtml = `
                                    <div class="mt-4 border-t border-slate-100 dark:border-slate-700 pt-4">
                                        <h3 class="text-xs font-bold uppercase text-slate-400 dark:text-slate-500 mb-2">Connected Edges</h3>
                                        <ul class="text-sm leading-relaxed">${rows}</ul>
                                    </div>`;
                            }

                            infoContent.innerHTML = `
                                <div class="animate-in fade-in duration-300">
                                    <b class="text-xl text-slate-900 dark:text-white block mb-1">${nodeData.label}</b>
                                    <span class="inline-block px-2 py-0.5 rounded bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300 text-xs font-bold uppercase mb-4">${nodeData.group}</span>
                                    <p class="text-slate-600 dark:text-slate-300 border-t border-slate-100 dark:border-slate-700 pt-4">${description}</p>
                                    ${edgesHtml}
                                </div>
                            `;
                        } else {
                            activeGroupFilter = null;
                            resetHighlight();
                            document.querySelectorAll('#group-filters button').forEach(b => b.classList.remove('bg-indigo-600', 'dark:bg-indigo-700', 'text-white', 'border-indigo-600'));
                            infoContent.innerHTML = `<span class="italic">Click a node to view details...</span>`;
                        }
                    });
                } else {
                    network.setOptions(networkOptions);
                }

                setTimeout(() => network.fit(), 200);

            } catch (error) {
                console.error(error);
                alert('Failed to load data file.');
            }
        }

        selector.addEventListener('change', (e) => loadData(e.target.value));

        window.onload = () => {
            initTheme();
            loadManifest();
        };
    </script>
</body>

</html>
